<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenMAIC Home — Design Playground</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 1fr auto;
    }
    aside {
      grid-row: 1 / 3;
      background: #161b26;
      border-right: 1px solid #2a3142;
      overflow-y: auto;
      padding: 16px;
    }
    aside h1 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    aside p { font-size: 11px; color: #94a3b8; margin-bottom: 16px; }
    .group { margin-bottom: 18px; }
    .group h2 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      margin-bottom: 10px;
    }
    label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    label span:last-child { font-family: ui-monospace, monospace; color: #818cf8; font-size: 11px; }
    input[type="range"] { width: 100%; accent-color: #818cf8; }
    select, button.preset {
      width: 100%;
      background: #1e2535;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    button.preset { margin-bottom: 6px; text-align: left; }
    button.preset:hover { border-color: #818cf8; }
    .presets { display: flex; flex-direction: column; gap: 0; }
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
    }
    footer {
      grid-column: 2;
      border-top: 1px solid #2a3142;
      background: #161b26;
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    #prompt {
      flex: 1;
      font-size: 12px;
      line-height: 1.5;
      color: #cbd5e1;
    }
    #copyBtn {
      flex-shrink: 0;
      background: #4f46e5;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    #copyBtn.copied { background: #059669; }

    /* Preview (mirrors HomeView) */
    .page {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }
    .page-bg {
      min-height: 520px;
      padding: 32px 20px;
      border-radius: 16px;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .title { font-weight: 700; letter-spacing: -0.02em; }
    .subtitle { color: #64748b; margin-top: 8px; font-size: 14px; }
    .card {
      margin-top: 28px;
      text-align: left;
      background: white;
      overflow: hidden;
    }
    .card-top, .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-color: #f1f5f9;
      background: rgba(248, 250, 252, 0.6);
    }
    .card-top { border-bottom: 1px solid #f1f5f9; }
    .card-bottom { border-top: 1px solid #f1f5f9; }
    .card-body { padding: 24px; min-height: 180px; color: #94a3b8; font-size: 15px; }
    .btn-enter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      color: white;
      background: #1e293b;
    }
    .btn-deep {
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      border: none;
      background: #e0f2fe;
      color: #0369a1;
    }
  </style>
</head>
<body>
  <aside>
    <h1>Home Design</h1>
    <p>Tweak OpenMAIC landing layout</p>

    <div class="group">
      <h2>Presets</h2>
      <div class="presets" id="presets"></div>
    </div>

    <div class="group">
      <h2>Layout</h2>
      <label>Card max width <span id="v-maxWidth">720px</span></label>
      <input type="range" id="maxWidth" min="560" max="900" value="720" />
      <label style="margin-top:10px">Card radius <span id="v-radius">24px</span></label>
      <input type="range" id="radius" min="8" max="40" value="24" />
      <label style="margin-top:10px">Card padding <span id="v-padding">24px</span></label>
      <input type="range" id="padding" min="12" max="40" value="24" />
    </div>

    <div class="group">
      <h2>Color</h2>
      <label>Title hue <span id="v-hue">270</span></label>
      <input type="range" id="hue" min="220" max="300" value="270" />
      <label style="margin-top:10px">Shadow blur <span id="v-shadow">40px</span></label>
      <input type="range" id="shadow" min="0" max="80" value="40" />
    </div>

    <div class="group">
      <h2>Typography</h2>
      <label>Title size <span id="v-titleSize">36px</span></label>
      <input type="range" id="titleSize" min="28" max="48" value="36" />
    </div>
  </aside>

  <main>
    <div class="page">
      <div class="page-bg" id="pageBg">
        <div class="logo" id="logoEl">
          <svg width="56" height="56" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="10" fill="url(#g)" />
            <path d="M16 8L22 12v8l-6 4-6-4v-8l6-4z" stroke="white" stroke-width="1.2" fill="none"/>
            <defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
          </svg>
        </div>
        <h2 class="title" id="titleEl">OpenMAIC</h2>
        <p class="subtitle">Generative Learning in Multi-Agent Interactive Classroom</p>
        <div class="card" id="cardEl">
          <div class="card-top"><span style="font-size:13px;color:#475569">嗨，同学</span><span style="font-size:12px;color:#94a3b8">准备好一起学习了吗？</span></div>
          <div class="card-body">输入你想学的任何内容，例如：…</div>
          <div class="card-bottom">
            <span style="color:#94a3b8;font-size:12px">📎 🌐</span>
            <span>
              <button class="btn-deep">深度交互</button>
              <button class="btn-enter" style="margin-left:8px">进入课堂 ↑ 10/10</button>
            </span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p id="prompt"></p>
    <button type="button" id="copyBtn">Copy Prompt</button>
  </footer>

  <script>
    const DEFAULTS = { maxWidth: 720, radius: 24, padding: 24, hue: 270, shadow: 40, titleSize: 36 };
    const state = { ...DEFAULTS };

    const PRESETS = {
      'Design default': { ...DEFAULTS },
      'Softer card': { maxWidth: 680, radius: 32, padding: 28, hue: 265, shadow: 56, titleSize: 34 },
      'Compact': { maxWidth: 600, radius: 16, padding: 16, hue: 255, shadow: 24, titleSize: 32 },
      'Bold purple': { maxWidth: 760, radius: 20, padding: 20, hue: 285, shadow: 48, titleSize: 40 },
      'Airy minimal': { maxWidth: 800, radius: 28, padding: 32, hue: 250, shadow: 20, titleSize: 36 },
    };

    const ids = ['maxWidth', 'radius', 'padding', 'hue', 'shadow', 'titleSize'];
    ids.forEach((id) => {
      document.getElementById(id).addEventListener('input', (e) => {
        state[id] = Number(e.target.value);
        updateAll();
      });
    });

    const presetsEl = document.getElementById('presets');
    Object.entries(PRESETS).forEach(([name, values]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'preset';
      btn.textContent = name;
      btn.addEventListener('click', () => {
        Object.assign(state, values);
        syncControls();
        updateAll();
      });
      presetsEl.appendChild(btn);
    });

    function syncControls() {
      ids.forEach((id) => {
        document.getElementById(id).value = state[id];
        document.getElementById('v-' + id).textContent =
          id === 'hue' ? state[id] : state[id] + 'px';
      });
    }

    function hsl(h, s, l) { return `hsl(${h} ${s}% ${l}%)`; }

    function renderPreview() {
      const pageBg = document.getElementById('pageBg');
      const card = document.getElementById('cardEl');
      const title = document.getElementById('titleEl');
      const page = document.querySelector('.page');

      page.style.maxWidth = state.maxWidth + 'px';
      pageBg.style.background = `
        radial-gradient(ellipse 120% 80% at 50% -20%, ${hsl(state.hue, 85, 92)} 0%, transparent 50%),
        radial-gradient(ellipse 80% 60% at 100% 50%, ${hsl(state.hue + 30, 90, 93)} 0%, transparent 45%),
        #f8fafc`;
      title.style.fontSize = state.titleSize + 'px';
      title.style.color = hsl(state.hue, 55, 28);
      card.style.borderRadius = state.radius + 'px';
      card.style.boxShadow = state.shadow
        ? `0 8px ${state.shadow}px -12px ${hsl(state.hue, 60, 60)}33`
        : 'none';
      card.querySelector('.card-body').style.padding = state.padding + 'px';
    }

    function updatePrompt() {
      const parts = ['Update the OpenMAIC home page (HomeView.vue)'];
      const tw = [];

      if (state.maxWidth !== DEFAULTS.maxWidth)
        parts.push(`set the main card max-width to about ${state.maxWidth}px`);
      if (state.radius !== DEFAULTS.radius)
        tw.push(`rounded-${state.radius >= 28 ? '3xl' : state.radius >= 20 ? '2xl' : 'xl'}`);
      if (state.padding !== DEFAULTS.padding)
        parts.push(`use ${state.padding}px inner padding in the input area`);
      if (state.hue !== DEFAULTS.hue)
        parts.push(`shift the accent/title color toward hue ${state.hue} (purple-indigo family)`);
      if (state.shadow !== DEFAULTS.shadow) {
        const qual = state.shadow > 50 ? 'pronounced' : state.shadow > 20 ? 'subtle' : 'minimal';
        parts.push(`give the playground card a ${qual} shadow (blur ~${state.shadow}px)`);
      }
      if (state.titleSize !== DEFAULTS.titleSize)
        parts.push(`set the OpenMAIC title to ${state.titleSize}px`);

      if (tw.length) parts.push('Tailwind hints: ' + tw.join(', '));
      if (parts.length === 1) parts.push('keep the current design defaults.');

      document.getElementById('prompt').textContent = parts.join('. ') + '.';
    }

    function updateAll() {
      ids.forEach((id) => {
        document.getElementById('v-' + id).textContent =
          id === 'hue' ? state[id] : state[id] + 'px';
      });
      renderPreview();
      updatePrompt();
    }

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const btn = document.getElementById('copyBtn');
      await navigator.clipboard.writeText(document.getElementById('prompt').textContent);
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy Prompt';
        btn.classList.remove('copied');
      }, 1500);
    });

    syncControls();
    updateAll();
  </script>
</body>
</html>
